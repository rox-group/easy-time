name: Sync README status

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-readme:
    name: Update README milestone table
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Update README milestone table
        run: python3 .github/scripts/update_readme_status.py

      - name: Create Pull Request if README changed
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs(auto): sync README milestone status"
          title: "docs(auto): sync README milestone status"
          body: "Automated pull request to synchronize README implementation milestones."
          branch: "docs/auto-sync-readme"
          labels: "documentation, automerge"
          delete-branch: true

