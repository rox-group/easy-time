name: Sync README status

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '.github/**'

permissions:
  contents: write

jobs:
  sync-readme:
    name: Update README milestone table
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update README milestone table
        run: python3 .github/scripts/update_readme_status.py

      - name: Commit README if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "README already up to date — nothing to commit."
          else
            git commit -m "docs(auto): sync README milestone status [skip ci]"
            git push
          fi
