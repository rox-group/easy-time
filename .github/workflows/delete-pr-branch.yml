name: Delete PR branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    name: Delete merged or closed PR branch
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete branch
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const defaultBranch = (context.payload.repository && context.payload.repository.default_branch) || 'main';
            const protectedBranches = [defaultBranch, 'main', 'master', 'develop', 'release', 'production'];

            if (protectedBranches.includes(branchName) || branchName.startsWith('release/')) {
              console.log(`Branch "${branchName}" is protected or default branch. Skipping deletion.`);
              return;
            }

            console.log(`Attempting to delete branch "${branchName}" for PR #${context.payload.pull_request.number}...`);
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`
              });
              console.log(`Successfully deleted branch "${branchName}".`);
            } catch (error) {
              if (error.status === 404 || error.status === 422) {
                console.log(`Branch "${branchName}" was already deleted or not found: ${error.message}`);
              } else {
                console.error(`Error deleting branch "${branchName}": ${error.message}`);
                throw error;
              }
            }
