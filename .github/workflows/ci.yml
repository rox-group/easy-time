name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify required project files
        run: |
          test -s README.md
          test -f .github/CODEOWNERS
          test -f .github/PULL_REQUEST_TEMPLATE.md
          test -f SECURITY.md

      - name: Lint Markdown and workflow YAML
        uses: github/super-linter@v7
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_MARKDOWN: true
          VALIDATE_YAML: true

  backend-test:
    name: Backend tests & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check backend

      - name: Run backend tests
        run: |
          pytest backend/tests -v -c backend/pyproject.toml

  ci-approval:
    name: Approve and comment on PR
    runs-on: ubuntu-latest
    needs: [validate, backend-test]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Post approval review with CI summary
        env:
          GH_TOKEN: ${{ secrets.USER_PAT || secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

        run: |
          BODY=$(cat <<'EOF'
          ### ✅ CI Verification Passed
          - **Repository Validation:** Passed (Markdown, YAML, project files)
          - **Backend Tests & Lint:** Passed (22/22 pytest tests, Ruff clean)

          Automated approval granted by CI.
          EOF
          )

          gh pr review "$PR_URL" --approve --body "$BODY" || gh pr comment "$PR_URL" --body "$BODY"


