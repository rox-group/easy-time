name: Stale PRs

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  stale:
    name: Mark and close stale pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: ''
          close-issue-message: ''
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          stale-pr-message: >
            This pull request has had no activity for 30 days. It will be closed
            in 7 days unless there is new activity. If this is still relevant,
            leave a comment or push a new commit to reset the timer.
          stale-pr-label: stale
          days-before-pr-close: 7
          close-pr-message: >
            Closing due to inactivity. Re-open or create a new pull request if
            this change is still needed.
          close-pr-label: closed-stale
          exempt-pr-labels: 'work-in-progress,automerge,do-not-merge'
